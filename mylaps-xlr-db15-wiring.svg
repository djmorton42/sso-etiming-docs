<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 420" role="img" aria-labelledby="title desc">
  <title id="title">XLR to MYLAPS D-sub 15 adapter wiring</title>
  <desc id="desc">Female 3-pin XLR pin 1 connects to D-sub pin 5 for ground. XLR pin 3 connects to D-sub pin 12 for the start signal. D-sub pins 8 and 13 are joined by a jumper inside the adapter. XLR pin 2 is left unconnected.</desc>
  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 15px; font-weight: 600; fill: #1c2430; }
    .sub { font-size: 12px; fill: #5c6773; }
    .name { font-size: 15px; fill: #1c2430; }
    .quiet { font-size: 15px; fill: #5c6773; }
    .pin { font-size: 13px; font-weight: 600; fill: #ffffff; }
    .pin-open { font-size: 13px; font-weight: 600; fill: #5c6773; }
    .jumper-label { font-size: 12px; font-weight: 600; fill: #9a5b12; }
    .note { font-size: 12px; fill: #5c6773; }
  </style>

  <rect width="816" height="420" fill="#ffffff"/>

  <text class="title" x="36" y="40">Female 3-pin XLR</text>
  <text class="sub" x="36" y="60">On the adapter</text>
  <text class="title" x="528" y="40">MYLAPS D-sub 15</text>
  <text class="sub" x="528" y="60">Auxiliary port</text>

  <line x1="36" y1="76" x2="300" y2="76" stroke="#e6e8ec" stroke-width="1"/>
  <line x1="492" y1="76" x2="780" y2="76" stroke="#e6e8ec" stroke-width="1"/>

  <!-- Ground: XLR 1 to D-sub 5 -->
  <line x1="300" y1="118" x2="500" y2="118" stroke="#243044" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="36" y="106" width="28" height="24" rx="5" fill="#243044"/>
  <text class="pin" x="50" y="118" text-anchor="middle" dominant-baseline="central">1</text>
  <text class="name" x="76" y="118" dominant-baseline="central">Ground</text>
  <circle cx="300" cy="118" r="6.5" fill="#ffffff" stroke="#243044" stroke-width="2.5"/>

  <circle cx="500" cy="118" r="6.5" fill="#ffffff" stroke="#243044" stroke-width="2.5"/>
  <rect x="520" y="106" width="28" height="24" rx="5" fill="#243044"/>
  <text class="pin" x="534" y="118" text-anchor="middle" dominant-baseline="central">5</text>
  <text class="name" x="560" y="118" dominant-baseline="central">Ground</text>

  <!-- Start: XLR 3 to D-sub 12 -->
  <line x1="300" y1="186" x2="500" y2="186" stroke="#0f7a46" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="36" y="174" width="28" height="24" rx="5" fill="#0f7a46"/>
  <text class="pin" x="50" y="186" text-anchor="middle" dominant-baseline="central">3</text>
  <text class="name" x="76" y="186" dominant-baseline="central">Start signal</text>
  <circle cx="300" cy="186" r="6.5" fill="#ffffff" stroke="#0f7a46" stroke-width="2.5"/>

  <circle cx="500" cy="186" r="6.5" fill="#ffffff" stroke="#0f7a46" stroke-width="2.5"/>
  <rect x="520" y="174" width="36" height="24" rx="5" fill="#0f7a46"/>
  <text class="pin" x="538" y="186" text-anchor="middle" dominant-baseline="central">12</text>
  <text class="name" x="568" y="186" dominant-baseline="central">Gun input return</text>

  <!-- XLR 2 unconnected -->
  <rect x="36" y="252" width="28" height="24" rx="5" fill="#eef1f4"/>
  <text class="pin-open" x="50" y="264" text-anchor="middle" dominant-baseline="central">2</text>
  <text class="quiet" x="76" y="264" dominant-baseline="central">Leave unconnected</text>
  <circle cx="300" cy="264" r="6.5" fill="#ffffff" stroke="#b0b7c0" stroke-width="2"/>

  <!-- Local jumper, kept clear of the cable wires -->
  <text class="jumper-label" x="520" y="248">Local jumper, inside the adapter</text>
  <path d="M 668 292 H 732 Q 748 292 748 308 V 340 Q 748 356 732 356 H 708" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>

  <circle cx="668" cy="292" r="6.5" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/>
  <rect x="528" y="280" width="28" height="24" rx="5" fill="#9a5b12"/>
  <text class="pin" x="542" y="292" text-anchor="middle" dominant-baseline="central">8</text>
  <text class="name" x="568" y="292" dominant-baseline="central">+5 V supply</text>

  <circle cx="708" cy="356" r="6.5" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/>
  <rect x="520" y="344" width="36" height="24" rx="5" fill="#9a5b12"/>
  <text class="pin" x="538" y="356" text-anchor="middle" dominant-baseline="central">13</text>
  <text class="name" x="568" y="356" dominant-baseline="central">Gun input positive</text>

  <text class="note" x="36" y="396">Pin numbers, not physical positions. Do not land an XLR wire on D-sub pin 8 or 13.</text>
</svg>
